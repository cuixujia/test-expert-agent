<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI测试用例工作台 · 雪狼项目</title>
<style>
:root{--blue:#2563eb;--blue-bg:#eff6ff;--green:#15803d;--amber:#a16207;--red:#b91c1c;--line:#e2e8f0;--muted:#64748b;--bg:#f5f7fb;--ink:#172033}
*{box-sizing:border-box}html,body{height:100%;min-height:0;overflow:hidden}
body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,textarea,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.muted{color:var(--muted)}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.logo{width:31px;height:31px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:750}.brand{font-weight:750;font-size:15px}.crumb{color:var(--muted);font-size:12px}.topright{margin-left:auto;color:var(--muted);font-size:12px}
.btn{padding:8px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;color:#334155;font-weight:650;transition:background .18s,border-color .18s}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}.btn.sm{font-size:12px;padding:5px 9px}.btn.ghost-danger{color:var(--red);border-color:#fecaca}.btn.ghost-danger:hover{background:#fef2f2}
.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;white-space:nowrap}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.green{background:#dcfce7;color:#166534}.pill.amber{background:#fef3c7;color:#92400e}.pill.red{background:#fee2e2;color:#991b1b}.pill.gray{background:#f1f5f9;color:#64748b}.pill.purple{background:#ede9fe;color:#5b21b6}
.workbench{height:calc(100vh - 56px);height:calc(100dvh - 56px);display:grid;grid-template-columns:248px minmax(0,1fr) 360px;background:#fff}
.left,.middle,.right{min-height:0;display:flex;flex-direction:column}
.left{border-right:1px solid var(--line);background:#fff}
.region-head{padding:13px 14px;border-bottom:1px solid var(--line)}.region-head h3{margin:0;font-size:14px}.region-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.proj-box{padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px}.proj-box b{font-size:13px;display:block}
.fn-list{flex:1;overflow:auto;padding:7px}
.fn-item{display:flex;align-items:center;gap:9px;padding:10px 9px;margin:3px 0;border:1px solid transparent;border-radius:8px;cursor:pointer;width:100%;background:transparent;text-align:left}.fn-item:hover{background:#f8fafc}.fn-item.active{background:var(--blue-bg);border-color:#bfdbfe}
.fn-code{font-size:11px;font-weight:750;background:#dbeafe;color:#1d4ed8;border-radius:5px;padding:2px 7px;flex:none;letter-spacing:.4px}
.fn-name{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.left-foot{border-top:1px solid var(--line);padding:10px 12px;font-size:11px;color:var(--muted)}
/* 中间 */
.middle{background:#fbfcfe}
.mid-head{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 0;flex:none}
.mid-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mid-title h2{font-size:16px;margin:0}.mid-title .sub{font-size:12px;color:var(--muted);margin:3px 0 0}
.modebar{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:12px;flex-wrap:wrap}
.mode-indicator{border:1px solid #bfdbfe;border-radius:6px;padding:3px 9px;background:var(--blue-bg);color:#1d4ed8;font-weight:700;font-size:11px}
.actor-chip{border:1px solid #fcd34d;border-radius:6px;padding:3px 9px;background:#fffbeb;color:#92400e;font-weight:700;font-size:11px}
.workflow{display:flex;overflow-x:auto;padding:10px 0 9px;scrollbar-width:thin}
.node{flex:0 0 auto;border:0;background:transparent;border-bottom:3px solid transparent;padding:7px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11.5px;color:var(--muted);font-weight:650}
.node .n{width:20px;height:20px;border:1px solid #cbd5e1;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:9.5px}
.node.done{color:var(--green)}.node.done .n{background:#dcfce7;border-color:#86efac}
.node.current{color:var(--blue);border-bottom-color:var(--blue)}.node.current .n{background:var(--blue);color:#fff;border-color:var(--blue)}
.node small{font-weight:400;opacity:.75}
.chat-scroll{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:13px;min-height:0}
.date-label{text-align:center;color:#64748b;font-size:11px}
.message{display:flex;gap:8px;max-width:94%;align-items:flex-start}
.avatar{width:27px;height:27px;border-radius:8px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:10px;font-weight:bold;flex:none}
.avatar.qc{background:#fef3c7;color:#92400e}.avatar.me{background:#e2e8f0;color:#475569}
.bubble{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:3px 11px 11px 11px;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.bubble .bt{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.bubble .who{font-weight:750}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin-top:6px}
.kv span:nth-child(odd){color:var(--muted);white-space:nowrap}
.mini-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:7px;background:#fff}
.mini-table th,.mini-table td{border:1px solid #e6ebf2;padding:5px 8px;text-align:left;vertical-align:top}
.mini-table th{background:#f8fafc;font-weight:700;color:#475569;white-space:nowrap}
.auto-note{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#166534;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:6px 10px;margin-top:8px}
.gate-card{border:1.5px solid #f59e0b;background:#fffbeb;border-radius:10px;padding:12px 14px;flex:1}
.gate-card .gt{font-weight:750;color:#92400e;display:flex;gap:7px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.gate-note{font-size:11px;color:#92400e;background:#fef3c7;border-radius:6px;padding:6px 9px;margin-top:8px;line-height:1.7}
.gate-sec{font-size:12px;margin-top:7px}.gate-sec b{display:block;font-size:11.5px;color:#92400e;margin-bottom:3px}
.composer{background:#fff;border-top:1px solid var(--line);padding:10px 14px;flex:none}
.compose-row{display:flex;gap:8px;align-items:center}
.compose-note{font-size:11px;color:#64748b;margin-top:6px}
/* 右侧 */
.right{border-left:1px solid var(--line);background:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;border:0;background:transparent;padding:10px 2px;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.art-body{flex:1;overflow:auto;padding:12px;min-height:0}
.art-row{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#fff}
.art-row .ar-t{font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.art-row .ar-s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.quote{border-left:3px solid #bfdbfe;background:#f8fafc;border-radius:0 6px 6px 0;padding:5px 9px;font-size:11.5px;color:#475569;margin-top:5px}
.mat-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:12px;background:#fff}
.mat-row .mn{flex:1;min-width:0}.mat-row .mn b{display:block;font-size:12px}.mat-row .mn span{font-size:11px;color:var(--muted)}
.stat-strip{display:flex;gap:7px;margin-bottom:10px}.stat-strip .st{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px}.stat-strip .st span{display:block;font-size:10.5px;color:var(--muted)}.stat-strip .st b{font-size:15px}
.empty-art{text-align:center;color:var(--muted);font-size:12px;padding:28px 10px;border:1px dashed #cbd5e1;border-radius:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#172033;color:#fff;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1}
@media(max-width:1100px){.workbench{grid-template-columns:210px minmax(0,1fr) 310px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo" aria-hidden="true">AI</div><div class="brand">AI测试用例工作台</div><div class="crumb" id="crumb">雪狼项目</div>
  <div class="topright">原型演示 · 不调用真实 Agent</div>
</header>

<main class="workbench">
  <!-- 左：项目与功能清单 -->
  <aside class="left">
    <div class="region-head"><h3>业务功能清单</h3><p>一次流程只做一个业务功能；切换须显式挂起</p></div>
    <div class="proj-box"><b>雪狼项目（XL2026）</b><span class="muted">工作空间已初始化 · runtime_XL2026</span></div>
    <div class="fn-list" id="fnList"></div>
    <div class="left-foot">职能三角：测试经理编排门禁 · 设计专家生成修复 · 质检专家只检不修。</div>
  </aside>

  <!-- 中：流程主区 -->
  <section class="middle">
    <div class="mid-head">
      <div class="mid-title">
        <div><h2 id="ctxTitle">—</h2><p class="sub" id="ctxSub">—</p></div>
        <span class="pill amber" id="ctxStatus">—</span>
      </div>
      <div class="modebar">
        <span class="mode-indicator">强确认门禁 ×2</span>
        <span class="actor-chip" id="actorChip">执行者：—</span>
        <span class="muted" id="modeHint">可选资料缺失标「未提供」继续 · 必需问题暂停澄清</span>
      </div>
      <nav class="workflow" id="workflow" aria-label="核心流程"></nav>
    </div>
    <div class="chat-scroll" id="chatScroll"><div class="date-label">任务对话</div></div>
    <div class="composer">
      <div class="compose-row">
        <button class="btn primary" id="mainAction">—</button>
        <span class="muted" style="font-size:12px" id="actionHint"></span>
      </div>
      <div class="compose-note">门禁仅接受：通过 / 调整@编号 说明 / 退回（`通过 阶段名` 为处置性通过）；其余措辞不视为确认。</div>
    </div>
  </section>

  <!-- 右：关键产物 -->
  <aside class="right">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="mats" role="tab">资料</button>
      <button class="tab" data-tab="tp" role="tab">测试点</button>
      <button class="tab" data-tab="cov" role="tab">覆盖对照</button>
      <button class="tab" data-tab="tc" role="tab">测试用例</button>
      <button class="tab" data-tab="qc" role="tab">质检报告</button>
    </div>
    <div class="art-body" id="artBody"></div>
  </aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= 工作空间数据（与初始化原型同源示例） ================= */
const TP_SEED=[
 ['TP-LBSH-001','验证贷款申请提交后进入待审批状态','M3-S1-P2','PRD §3.1「提交成功后，申请单流转至待审批列表」'],
 ['TP-LBSH-002','验证审批通过后自动生成放款任务','M3-S4-P1','PRD §3.4「审批通过后，系统自动生成放款任务」'],
 ['TP-LBSH-003','验证审批金额超过剩余额度被拒绝','M4-S2-P3','PRD §4.2「审批金额不得超过项目剩余额度」'],
 ['TP-LBSH-004','验证审批意见为空时无法提交审批结果','M3-S3-P4','PRD §3.3「审批意见为必填项」'],
 ['TP-LBSH-005','验证被退回的申请可修改后重新提交','M3-S5-P2','PRD §3.5「退回申请可编辑后重新提交」']];
const TC_SEED=[
 ['TC-LBSH-001','提交完整申请单，状态变为待审批','TP-LBSH-001','P0','正向'],
 ['TC-LBSH-002','审批通过，系统生成放款任务','TP-LBSH-002','P0','正向'],
 ['TC-LBSH-003','审批金额=剩余额度+100 元，审批被拒绝','TP-LBSH-003','P1','边界'],
 ['TC-LBSH-004','审批意见留空提交，页面提示必填','TP-LBSH-004','P1','反向'],
 ['TC-LBSH-005','退回申请修改后重新提交成功','TP-LBSH-005','P2','流程'],
 ['TC-LBSH-006','审批金额为 0 元，被拒绝并给出提示','TP-LBSH-003','P2','异常']];
/* mats 键：prd / domain 领域知识 / reverse 逆向 / knowledge 功能知识 / etp 存量测试点 / fe / be / db / etc 存量用例 */
const FN_STATE={
 '贷款申请审批':{code:'LBSH',domain:'信贷管理',status:'进行中',stage:1,tpRounds:0,tcRounds:0,noUi:false,
   mats:{prd:['贷款申请审批-需求说明书-v1.3.md'],domain:['信贷业务产品要素说明.md','信贷术语与状态机.md'],reverse:['reverse.md'],knowledge:['审批流程规则.md'],etp:[],
         fe:['审批页面前端设计.md'],be:['审批服务接口设计.md'],db:['审批库表设计.md'],etc:['存量用例集-2025Q3.json']},
   etpNote:'',etcNote:'存量 45 条 · 2025Q3 归档',tps:null,tpStatus:'—',tcs:null,tcStatus:'—',qc:[]},
 '贷款申请受理':{code:'SQSL',domain:'信贷管理',status:'待开工',stage:1,tpRounds:0,tcRounds:0,noUi:false,
   mats:{prd:['贷款申请受理-需求说明书-v1.1.md'],domain:['信贷业务产品要素说明.md','信贷术语与状态机.md'],reverse:[],knowledge:[],etp:[],
         fe:[],be:['受理服务接口设计.md'],db:[],etc:[]},
   etpNote:'',etcNote:'',tps:null,tpStatus:'—',tcs:null,tcStatus:'—',qc:[]},
 '限额计算服务':{code:'XZJS',domain:'支付结算',status:'待开工',stage:1,tpRounds:0,tcRounds:0,noUi:true,
   mats:{prd:['限额计算服务-接口需求-v1.0.md'],domain:['清算业务规则汇编.md'],reverse:[],knowledge:[],etp:[],
         fe:[],be:['限额计算服务接口设计.md'],db:[],etc:[]},
   etpNote:'',etcNote:'',tps:null,tpStatus:'—',tcs:null,tcStatus:'—',qc:[]},
 '贷后管理':{code:'DHGL',domain:'信贷管理',status:'已完成',stage:10,tpRounds:0,tcRounds:0,noUi:false,
   mats:{prd:['贷后管理-需求说明书-v2.0.md'],domain:['信贷业务产品要素说明.md'],reverse:['reverse.md'],knowledge:[],etp:['存量测试点-贷后.json'],
         fe:['贷后工作台设计.md'],be:['贷后服务接口设计.md'],db:['贷后库表设计.md'],etc:['存量用例集-2025Q2.json']},
   etpNote:'存量 38 条',etcNote:'存量 62 条',tps:'archived',tpStatus:'已确认',tcs:'archived',tcStatus:'已确认',
   qc:[['S4 测试点质检','语义关 38/38 · validate.sh test-point PASS'],['S8 用例质检','语义关 62/62 · TP 覆盖 100% · validate.sh test-case PASS']]},
};
let cur='贷款申请审批',artTab='mats';

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
const F=()=>FN_STATE[cur];
/* 界面阶段：1=S1 2=S2 3=S3 4=S4+S5 5=S6 6=S7 7=S8+S9 10=完成 */
const NODES=[
 {id:1,n:'S1',t:'会话接续',actor:'测试经理'},{id:2,n:'S2',t:'测试点资料质检',actor:'质检专家'},
 {id:3,n:'S3',t:'生成测试点',actor:'设计专家'},{id:4,n:'S4+S5',t:'质检·确认',actor:'质检专家 + 经理确认',gate:1},
 {id:5,n:'S6',t:'用例资料质检',actor:'经理判定 + 质检专家'},{id:6,n:'S7',t:'生成测试用例',actor:'设计专家'},
 {id:7,n:'S8+S9',t:'质检·确认',actor:'质检专家 + 经理确认',gate:1}];
const ACTOR={1:'测试经理',2:'测试质检专家',3:'测试设计专家',4:'测试质检专家检查 → 测试经理请确认',4.5:'等待用户合并确认（S4+S5）',5:'测试经理适用性判定 + 测试质检专家',6:'测试设计专家',7:'测试质检专家检查 → 测试经理请确认',7.5:'等待用户合并确认（S8+S9）',10:'—'};

/* ================= 左侧功能清单 ================= */
function renderFnList(){
  $('#fnList').innerHTML=Object.entries(FN_STATE).map(([name,s])=>`
    <button class="fn-item ${name===cur?'active':''}" data-fn="${esc(name)}">
      <span class="fn-code">${esc(s.code)}</span><span class="fn-name">${esc(name)}</span>
      <span class="pill ${s.status==='已完成'?'green':s.status==='进行中'?'amber':'gray'}">${s.status}</span>
    </button>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fn]');if(!b)return;
  cur=b.dataset.fn;renderFnList();renderHeader();renderWorkflow();renderArt();
  $('#chatScroll').innerHTML='<div class="date-label">任务对话</div>';
  const s=F();
  if(s.stage===10){addMsg('me',`切换至「${cur}」。`);addMsg('agent','该功能流程已完成，产物已归档，可在右侧页签查看。');}
  else{s1Resume();}
  syncAction();
});
/* S1 内部会话接续（经理，无常规门禁，自动进入 S2） */
function s1Resume(){
  const s=F();
  addMsg('me',`开始「${cur}」的测试用例流程。`);
  addMsg('agent',`<div class="bt"><b>S1 内部会话接续</b><span class="pill blue">测试经理</span><span class="pill gray">无常规门禁</span></div>
    定位工作空间 <code>runtime_XL2026/file/${s.code}-${cur}/</code>，完成接续检查：
    <div class="kv"><span>PRD 指纹</span><span>md5 a1b2c3d4… 与登记一致 ✓（版本锁定）</span><span>文本快照</span><span>prd.txt 就绪 · 只读 · 引号已归一</span><span>锚点底册</span><span>scope.md 已建立并冻结（受控补录除外）</span><span>状态登记</span><span>state.md 已读取，与产物条目数核对一致</span></div>
    <div class="auto-note">✓ 无待用户处理问题 · 自动进入 S2 测试点资料质检</div>`);
  s.stage=2;
}

/* ================= 上下文与流程条 ================= */
function renderHeader(){
  const s=F();
  $('#ctxTitle').textContent=`${s.code}-${cur} · 测试用例生成`;
  $('#ctxSub').textContent=`所属业务领域：${s.domain} · 物料挂载自 runtime_XL2026`;
  $('#ctxStatus').textContent=s.status;
  $('#ctxStatus').className='pill '+(s.status==='已完成'?'green':s.status==='进行中'?'amber':'gray');
  $('#crumb').textContent=`雪狼项目 / ${s.domain} / ${cur}`;
  $('#actorChip').textContent='执行者：'+ACTOR[s.stage];
}
function renderWorkflow(){
  const s=F();const fl=Math.floor(s.stage);
  $('#workflow').innerHTML=NODES.map(nd=>{
    const done=(fl>nd.id&&s.stage<10)||s.stage===10,curS=fl===nd.id&&s.stage<10;
    return `<button class="node ${done?'done':''} ${curS?'current':''}"><span class="n">${done?'✓':nd.n}</span>${nd.t}${nd.gate?' <small>◆合并确认</small>':''}</button>`;
  }).join('');
}

/* ================= 对话流 ================= */
function addMsg(role,html){
  const av=role==='agent'?'<div class="avatar">理</div>':role==='qc'?'<div class="avatar qc">检</div>':role==='ds'?'<div class="avatar" style="background:#ede9fe;color:#5b21b6">设</div>':'<div class="avatar me">我</div>';
  const who=role==='agent'?'<b class="who">测试经理</b>':role==='qc'?'<b class="who">测试质检专家</b>':role==='ds'?'<b class="who">测试设计专家</b>':'<b class="who">我</b>';
  const el=document.createElement('div');el.className='message';
  el.innerHTML=`${av}<div class="bubble">${who}${html}</div>`;
  $('#chatScroll').appendChild(el);$('#chatScroll').scrollTop=1e9;
}
function matRow(name,desc,required,files,stockNote){
  const has=files&&files.length;
  const st=has?'<span class="pill green">使用</span>':required?'<span class="pill red">缺失 · 必须</span>':'<span class="pill gray">未提供 · 跳过</span>';
  const src=has?esc(files.join('、')):(stockNote?`存量资产：${esc(stockNote)}`:'空间中不存在');
  return `<div class="mat-row"><span class="mn"><b>${esc(name)} ${required?'<span class="pill red">必须</span>':'<span class="pill gray">可选</span>'}</b><span>${esc(desc)} · 来源：${src}</span></span>${st}</div>`;
}
function tpMats(){const m=F().mats;return matRow('PRD 需求文档','测试点溯源基准（五维质检对象）',1,m.prd)+matRow('领域知识','业务规则 / 产品要素',0,m.domain)+matRow('逆向文档','功能现状梳理',0,m.reverse)+matRow('功能知识','功能级业务知识',0,m.knowledge)+matRow('存量测试点','历史测试点参考',0,m.etp,F().etpNote)}
function tcMats(){const m=F().mats;return tpMats()+matRow('前端设计','页面 / 交互逻辑依据（适用时必需）',1,m.fe)+matRow('后端设计','接口 / 服务逻辑依据（适用时必需）',1,m.be)+matRow('数据库设计','库表与数据约束',0,m.db)+matRow('存量测试用例','历史用例参考',0,m.etc,F().etcNote)}
function covTpTable(){
  return `<div class="mini-table"><tr><th>锚点</th><th>测试点</th><th>覆盖</th></tr>`+TP_SEED.map(t=>`<tr><td>${t[2]}</td><td>${t[0]}</td><td><span class="pill green">已建点</span></td></tr>`).join('')+`</div><div style="font-size:11px;color:var(--muted);margin-top:4px">未覆盖项必须显式填写原因，禁止留空。</div>`;
}
function covTcTable(){
  const byTp={};TC_SEED.forEach(t=>{(byTp[t[2]]=byTp[t[2]]||[]).push(t[0])});
  return `<div class="mini-table"><tr><th>测试点</th><th>用例</th><th>覆盖</th></tr>`+TP_SEED.map(t=>{const l=byTp[t[0]]||[];return `<tr><td>${t[0]}</td><td>${l.join('、')||'—'}</td><td>${l.length?'<span class="pill green">已生成</span>':'<span class="pill amber">豁免 · 需填原因</span>'}</td></tr>`}).join('')+`</div>`;
}

/* ================= 流程推进 ================= */
function doStage(){
  const s=F();const st=s.stage;
  if(st===2){ /* S2 资料质检 */
    if(!s.mats.prd.length)return toast('阻断：PRD 缺失，无法进行测试点资料质检');
    addMsg('agent','<div class="bt">派发 S2 → 测试质检专家<span class="pill gray">只检不修</span></div>派发单：阶段任务、快照与底册路径、S2 资料清单、加载 prd-quality-check、无产物写权限。');
    addMsg('qc',`<div class="bt"><b>S2 测试点资料质检</b><span class="pill purple">prd-check.md</span></div>
      <div class="kv"><span>五维检查</span><span>完整性 / 一致性 / 无二义性 / 可测试性 / 可追溯性 · 通过</span><span>矛盾检测矩阵</span><span>0 处冲突（检索工具辅助，结论留痕）</span><span>漏锚扫描</span><span>按功能名原词逐处判定：已建锚 12 · 疑似缺锚 0 · 范围外 2</span></div>
      <div style="margin-top:8px">可选资料登记（路径 / 可读性 / 相关性）：</div>${tpMats()}`);
    addMsg('agent','<div class="auto-note">✓ S2 无待用户处理问题 · 自动进入 S3（质检通过无需确认）</div>');
    s.stage=3;
  }else if(st===3){ /* S3 生成 */
    addMsg('agent','<div class="bt">派发 S3 → 测试设计专家<span class="pill gray">生成与修复</span></div>派发单：任务与路径、S2 资料质检报告、需加载 test-point-spec、写入授权 test-point.md 草稿。');
    addMsg('ds',`<div class="bt"><b>S3 生成测试点</b><span class="pill purple">test-point.md 草稿</span><span>产物 SHA-256 已随稿返回</span></div>
      <div class="mini-table"><tr><th>编号</th><th>验证目标</th><th>锚点</th><th>依据摘录（≤40 字）</th></tr>${TP_SEED.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td><td>${esc(t[3])}</td></tr>`).join('')}</div>
      <div style="margin-top:7px">共 ${TP_SEED.length} 条 · 编号只增不改不复用 · 随清单产出<b>锚点→TP 覆盖对照表</b>（见右侧「覆盖对照」页签）。</div>`);
    s.tps=TP_SEED.map(t=>[...t]);s.tpStatus='草稿';s.stage=4;
  }else if(st===4){ /* S4 质检 */
    s.tpRounds++;
    addMsg('agent','<div class="bt">派发 S4 → 测试质检专家<span class="pill gray">两关质检</span></div>');
    addMsg('qc',`<div class="bt"><b>S4 测试点质检（第 ${s.tpRounds} 轮）</b><span class="pill purple">tp-check.md</span></div>
      <div class="kv"><span>语义关</span><span>出处 / 切分 / 命名 / 可判定 / 覆盖反向核对 · TP-LBSH-003 摘录超 40 字（<span class="pill amber">Major</span>·产物级）→ 退回 S3 修复</span><span>形式关</span><span>validate.sh test-point · 修复后复跑 PASS</span><span>复检结论</span><span>${s.tpRounds} 轮收敛 · 5/5 通过 · 脚本 PASS 且语义关通过 → 可定稿</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">脚本 PASS ≠ 质检通过：两关都过才可发起合并确认；同一阶段连续 3 轮未收敛将暂停请用户裁定。</div>`);
    s.qc.push(['S4 测试点质检',`第 ${s.tpRounds} 轮 · 修复 1 项 Major 后 5/5 通过 · validate.sh PASS`]);
    addMsg('agent','质检通过，发起 <b>S4+S5 合并确认</b>——「通过」将同时完成质检认可与测试点验收。');
    s.tpStatus='已定稿';s.stage=4.5;renderGate('测试点',s.tpRounds);
  }else if(st===5){ /* S6 */
    if(s.noUi){
      addMsg('agent',`<b>设计适用性判定</b>：本功能为纯接口/算法功能，无操作界面 → 登记「<b>前端设计不适用</b>」继续；后端设计为必需。`);
    }else{
      addMsg('agent',`<b>设计适用性判定</b>：本功能含操作界面（审批工作台页面）→ 前端设计适用且<b>必需</b>；后端设计必需；数据库设计、存量用例可选。`);
      if(!s.mats.fe.length||!s.mats.be.length){renderUiGate();return}
    }
    addMsg('agent','<div class="bt">派发 S6 → 测试质检专家<span class="pill gray">复用未变化资料结论</span></div>');
    addMsg('qc',`<div class="bt"><b>S6 用例资料质检</b><span class="pill purple">design-check.md</span></div>
      <div class="kv"><span>适用性复核</span><span>经理判定无误 · 已验收 TP 复核通过</span><span>资料复用</span><span>S2 资料（PRD / 领域知识 / 逆向 / 功能知识）未变化 · 复用既有结论</span></div>
      <div style="margin-top:8px">设计资料登记：</div>${tcMats()}`);
    addMsg('agent','<div class="auto-note">✓ S6 无待用户处理问题 · 自动进入 S7</div>');
    s.stage=6;
  }else if(st===6){ /* S7 */
    addMsg('agent','<div class="bt">派发 S7 → 测试设计专家<span class="pill gray">生成与修复</span></div>派发单：已验收 TP 基线、适用设计、复用资料清单、需加载 test-case-spec、写入授权 test-case.md 草稿。');
    addMsg('ds',`<div class="bt"><b>S7 生成测试用例</b><span class="pill purple">test-case.md 草稿</span><span>产物 SHA-256 已随稿返回</span></div>
      <div class="mini-table"><tr><th>编号</th><th>标题（场景+预期）</th><th>关联 TP</th><th>优先级</th><th>类型</th></tr>${TC_SEED.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`).join('')}</div>
      <div style="margin-top:7px">共 ${TC_SEED.length} 条 · 十字段完整（前置条件/测试数据/步骤/预期结果略）· <b>TP→TC 覆盖对照表</b>随稿产出。</div>`);
    s.tcs=TC_SEED.map(t=>[...t]);s.tcStatus='草稿';s.stage=7;
  }else if(st===7){ /* S8 */
    s.tcRounds++;
    addMsg('agent','<div class="bt">派发 S8 → 测试质检专家<span class="pill gray">两关质检</span></div>');
    addMsg('qc',`<div class="bt"><b>S8 测试用例质检（第 ${s.tcRounds} 轮）</b><span class="pill purple">tc-check.md</span></div>
      <div class="kv"><span>语义关</span><span>十字段 / TP 单挂 / 可判定预期 · TC-LBSH-006 优先级标注有误（<span class="pill amber">Major</span>·产物级）→ 退回 S7 修复</span><span>形式关</span><span>validate.sh test-case · 修复后复跑 PASS</span><span>覆盖校验</span><span>TP 覆盖 5/5 · 无豁免 · 复检 6/6 通过</span></div>`);
    s.qc.push(['S8 用例质检',`第 ${s.tcRounds} 轮 · 修复 1 项 Major 后 6/6 通过 · TP 覆盖 100% · validate.sh PASS`]);
    addMsg('agent','质检通过，发起 <b>S8+S9 合并确认</b>——「通过」将同时完成质检认可与用例评审，产物归档 output/ 并同步物理存储。');
    s.tcStatus='已定稿';s.stage=7.5;renderGate('测试用例',s.tcRounds);
  }
  renderWorkflow();renderFnList();renderArt();syncAction();
}
/* 无界面功能豁免 / 缺设计的用户裁决卡 */

    <div class="gt">◆ 需要你裁定 · 前端设计缺失（适用时必需）</div>
    <div style="font-size:12.5px;line-height:1.7">工作空间中未发现「${esc(cur)}」的前端设计。经理判定存疑：该功能是否有操作界面？</div>
    <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
      <button class="btn sm" data-ui="exempt">无界面 · 登记「前端设计不适用」并继续</button>

document.addEventListener('click',e=>{

  else{addMsg('me','有界面，我补充设计');toast('原型演示：补充设计后由经理重新登记并送 S6 质检');}
});
function doStageResume(st){const s=F();s.stage=st;renderWorkflow();renderArt();syncAction();}

/* ================= 合并确认门禁 ================= */
function renderGate(kind,round){
  const isTp=kind==='测试点';
  const el=document.createElement('div');el.className='message';
  el.innerHTML=`<div class="avatar me"></div><div class="gate-card" style="flex:1">
    <div class="gt">◆ 合并确认 · ${isTp?'S4 质检通过 + S5 用户验收':'S8 质检通过 + S9 用户评审'}（第 ${round} 轮）</div>
    <div class="gate-sec"><b>① 质检结论（报告要点）</b>语义关通过 · 形式关 validate.sh ${isTp?'test-point':'test-case'} PASS · 无 Blocker / 待决 Major</div>
    <div class="gate-sec"><b>② 产物清单</b>${isTp?'test-point.md（5 条，已定稿）+ 覆盖对照表（锚点→TP 5/5）':'test-case.md（6 条，已定稿）+ 覆盖对照表（TP→TC 5/5）'}</div>
    <div style="font-size:12.5px;margin-top:7px">答复：<b>通过</b>（同时完成质检认可与${isTp?'验收':'评审'}）／ <b>调整@编号 说明</b>（修订后必经复检）／ <b>退回</b>（回退生成阶段）。</div>
    <div class="gate-note">其余措辞不视为确认；确认记录登记 state.md，追加留痕不覆盖；连续 3 轮未收敛将暂停请你裁定。</div>
    <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
      <button class="btn primary sm" data-gate="pass">通过</button>
      <button class="btn sm" data-gate="adj">调整@编号…</button>
      <button class="btn ghost-danger sm" data-gate="back">退回</button>
    </div></div>`;
  $('#chatScroll').appendChild(el);$('#chatScroll').scrollTop=1e9;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-gate]');if(!g)return;
  const s=F();const isTp=s.stage===4.5;
  if(g.dataset.gate==='pass'){
    addMsg('me','通过');
    if(isTp){addMsg('agent','已登记 S5 确认：测试点基线生效（编号只增不改不复用，后续仅受控变更）。<div class="auto-note">✓ 进入 S6 用例资料质检</div>');s.stage=5;s.tpStatus='已确认';}
    else{addMsg('agent','已登记 S9 评审：全部流程完成 🎉 test-point.md / test-case.md 已归档 output/ 并同步物理存储；本次新检出问题模式将回灌 prd-quality-check 基线。');s.stage=10;s.status='已完成';s.tpStatus='已确认';s.tcStatus='已确认';}
  }else if(g.dataset.gate==='adj'){
    const no=prompt('输入要调整的编号（如 TP-LBSH-003）：');if(!no)return;
    const note=prompt('调整说明：')||'';
    addMsg('me',`调整@${no} ${note}`);
    addMsg('agent',`派发修复 → 测试设计专家（复用会话，不消耗质检轮次）；修订完成后送质检专家<b>复检</b>（轮次 +1）。`);
    if(isTp){s.tpRounds++;s.stage=4.5;addMsg('qc',`<b>测试点复检（第 ${s.tpRounds} 轮）</b>：${no} 修订有效，本轮 0 问题 · validate.sh PASS。`);renderGate('测试点',s.tpRounds);}
    else{s.tcRounds++;s.stage=7.5;addMsg('qc',`<b>用例复检（第 ${s.tcRounds} 轮）</b>：${no} 修订有效，本轮 0 问题 · validate.sh PASS · TP 覆盖不变。`);renderGate('测试用例',s.tcRounds);}
  }else{
    addMsg('me','退回');
    addMsg('agent',`已退回：回退到${isTp?'S3 生成测试点':'S7 生成测试用例'}；已通过阶段保留「曾经通过」痕迹，修订产物必经复检。`);
    s.stage=isTp?3:6;
  }
  renderWorkflow();renderFnList();renderArt();syncAction();
});

/* ================= 主按钮 ================= */

    5:['开始用例资料质检（经理判定 + 质检专家）','先做设计适用性判定，再复核登记'],
    6:['派发生成测试用例（设计专家）','基于已验收 TP 与适用设计生成'],
    7:['提交用例质检（派发质检专家）','含 TP 覆盖校验'],

  }else if(artTab==='cov'){
    if(s.stage<3){el.innerHTML='<div class="empty-art">S3 生成时产出「锚点→TP」对照，S7 产出「TP→TC」对照。</div>';return}
    el.innerHTML=`<h3 style="margin:2px 0 7px;font-size:12.5px">锚点 → TP（S3 产出 · S4 核对）</h3>${covTpTable()}
      <h3 style="margin:12px 0 7px;font-size:12.5px">TP → TC（S7 产出 · S8 核对）</h3>${s.stage<6?'<div class="empty-art" style="padding:14px">用例生成后展示。</div>':covTcTable()}
      <div style="font-size:11px;color:var(--muted);margin-top:8px">TP 全覆盖豁免须填写原因，并核对 state.md 中的用户澄清或风险记录。</div>`;
  }else if(artTab==='tc'){
    if(s.tcs==='archived'){el.innerHTML='<div class="empty-art">产物已归档至 output/ 并同步物理存储。<br>原型不含历史数据，可在质检报告页签查看归档结论。</div>';return}
    if(s.stage<6||!s.tcs){el.innerHTML='<div class="empty-art">尚未生成测试用例。<br>测试点基线确认后，推进至 S7 生成。</div>';return}
    el.innerHTML=`<div class="stat-strip"><div class="st"><b>${s.tcs.length}</b><span>用例</span></div><div class="st"><b>5/5</b><span>TP 覆盖</span></div><div class="st"><b>${esc(s.tcStatus)}</b><span>状态</span></div></div>`+
      s.tcs.map(t=>`<div class="art-row"><div class="ar-t"><b>${esc(t[0])}</b><span class="pill ${t[3]==='P0'?'red':t[3]==='P1'?'amber':'blue'}">${t[3]}</span><span class="pill ${t[4]==='异常'?'red':t[4]==='边界'?'blue':'green'}">${t[4]}</span><span class="pill gray">↳ ${esc(t[2])}</span></div><div class="ar-s">${esc(t[1])}</div><div class="ar-s">前置条件 / 测试数据 / 操作步骤 / 预期结果 · 十字段完整（略）</div></div>`).join('');
  }else{
    el.innerHTML=s.qc.length?s.qc.map(q=>`<div class="art-row"><div class="ar-t"><b>${esc(q[0])}</b></div><div class="ar-s">${esc(q[1])}</div></div>`).join(''):'<div class="empty-art">暂无质检报告。<br>S2/S4/S6/S8 由质检专家执行，报告按轮次追加留痕。</div>';
  }
}

/* ================= 初始化 ================= */
renderFnList();renderHeader();renderWorkflow();renderArt();syncAction();
s1Resume();syncAction();
</script>
